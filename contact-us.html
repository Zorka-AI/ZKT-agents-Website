<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZKT-Agents</title>
  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
</head>

<body>
  <a href="index.html" class="link-clean">
    <header class="brand">
      <img src="assets/icon/favicon.png" alt="ZKT-Agents Logo" height="60" class="logo"/>
      <h1>ZKT-Agents</h1>
    </header>
  </a>

  <main class="page">
    <h2>Füllen Sie dieses Formular aus und wir melden uns innerhalb von 24&nbsp;Stunden.</h2>

    <section class="contact-form">
      <form action="https://amstetten.chickenkiller.com/webhook/kontakt" method="post" accept-charset="UTF-8">
        <div class="form-row">
          <label class="label" for="name-input">Name</label>
          <input class="input" type="text" id="name-input" name="name" required autocomplete="name" placeholder="Max Mustermann"/>
        </div>

        <div class="form-row">
          <label class="label" for="mail-input">E-Mail</label>
          <input class="input" type="email" id="mail-input" name="email" required autocomplete="email" placeholder="max.mustermann@mustermail.de"/>
        </div>

        <div class="form-row">
          <label class="label" for="company-name-input">Firma</label>
          <input class="input" type="text" id="company-name-input" name="company" required autocomplete="organization" placeholder="Google"/>
        </div>

        <div class="form-row">
          <label class="label" for="role-input">Rolle in der Firma</label>
          <input class="input" type="text" id="role-input" name="role" required placeholder="CEO" />
        </div>

        <div class="form-row">
          <label class="label" for="website-input">Website der Firma</label>
          <input class="input" type="url" id="website-input" name="website" required placeholder="https://example.com"/>
        </div>

        <div class="form-row">
          <label class="label" for="company-size-input">Größe der Firma</label>
          <select class="input" id="company-size-input" name="company_size" required>
            <option value="" selected disabled>Bitte wählen…</option>
            <option value="less-than-20">Weniger als 20 Mitarbeiter</option>
            <option value="20-50">20 bis 50 Mitarbeiter</option>
            <option value="50-100">50 bis 100 Mitarbeiter</option>
            <option value="100-500">100 bis 500 Mitarbeiter</option>
            <option value="more-than-500">Mehr als 500 Mitarbeiter</option>
          </select>
        </div>

        <div class="form-row">
          <label class="label" for="company-revenue-input">Jährlicher Umsatz</label>
          <select class="input" id="company-revenue-input" name="revenue" required>
            <option value="" selected disabled>Bitte wählen…</option>
            <option value="less-than-50k">Weniger als 50.000€</option>
            <option value="50k-100k">50.000€ bis 100.000€</option>
            <option value="100k-500k">100.000€ bis 500.000€</option>
            <option value="500k-1M">500.000€ bis 1.000.000€</option>
            <option value="1M-2M">1.000.000€ bis 2.000.000€</option>
            <option value="more-than-2M">Mehr als 2.000.000€</option>
          </select>
        </div>

        <div class="form-row">
          <label class="label" for="service-interest-input">Welche Services interessieren Sie?</label>
          <select class="input" id="service-interest-input" name="service" required>
            <option value="identify-ai-opportunities">Identifizierung von KI-Möglichkeiten</option>
            <option value="educate-team-ai">Team zu KI schulen</option>
            <option value="custom-ai-solutions">Maßgeschneiderte KI-Lösungen</option>
          </select>
        </div>

        <div class="form-row span-2">
          <label class="label" for="message-input">Nachricht</label>
          <textarea class="input" id="message-input" name="message" rows="7" required></textarea>
        </div>

        <button class="send-button" type="submit" aria-label="Anfrage abschicken">Anfrage abschicken ➔</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footerdiv">
      <div class="footer-cta">
        <a class="contact-us" href="contact-us.html">
          <img src="assets/pictures/mail_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="" height="48" aria-hidden="true"/>
          <span>Wie können wir helfen? <br/><u>Kontaktieren Sie uns.</u></span>
        </a>
      </div>

      <hr class="footer-sep"/>

      <nav class="footer-links" aria-label="Footer Navigation">
        <a class="link-clean" href="https://www.github.com/Zorka-AI/" target="_blank" rel="noopener">
          <iconify-icon icon="fa6-brands:github" aria-hidden="true"></iconify-icon>
          <span>GitHub</span>
        </a>
        <a class="link-clean" href="mailto:info@zktagents.com">· info@zktagents.com</a>
        <a class="link-clean" href="#">· Nutzungsbedingungen</a>
        <a class="link-clean" href="#">· Datenschutzrichtlinien</a>
        <a class="link-clean" href="#">· Impressum</a>
      </nav>

      <p class="copy">&copy; 2025 ZKT-AI Agents. Alle Rechte vorbehalten.</p>
    </div>
  </footer>
</body>
</html>
